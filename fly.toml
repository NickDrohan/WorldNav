# Fly.io config for the WorldNav static frontend.
# Deploy with:  fly launch --copy-config --name <your-app-name>   (first time)
#          or:  fly deploy
app = "world-report"
primary_region = "iad"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
